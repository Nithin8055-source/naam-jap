name: Naam Jap Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        shell: bash
        run: |
          set +e
          java -version || exit $?
          ./gradlew --version || exit $?

          run_gradle_task() {
            local log_file="$1"
            shift
            echo "Running: $*"
            "$@" --console=plain --stacktrace --info 2>&1 | tee "$log_file"
            local gradle_exit=${PIPESTATUS[0]}
            if [[ "$gradle_exit" -ne 0 ]]; then
              echo "Gradle task failed with exit code $gradle_exit. Reprinting complete, unfiltered output: $log_file"
              cat "$log_file"
              return "$gradle_exit"
            fi
            return 0
          }

          run_gradle_task ksp-debug.log ./gradlew :app:kspDebugKotlin || exit $?
          run_gradle_task compile-debug.log ./gradlew :app:compileDebugKotlin || exit $?
          run_gradle_task build-test-lint.log ./gradlew assembleDebug testDebugUnitTest lintDebug || exit $?
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload Gradle diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naam-jap-gradle-diagnostics
          path: |
            ksp-debug.log
            compile-debug.log
            build-test-lint.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naam-jap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
