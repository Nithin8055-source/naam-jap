name: Naam Jap Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        shell: bash
        env:
          SUPABASE_URL: https://tpcuynecaprnlruqamqr.supabase.co

          SUPABASE_PUBLISHABLE_KEY: sb_publishable_iuRAlXtFg8Z3k29zV4ExPA_SqzRPjh4
        run: |
          set -o pipefail

          java -version
          ./gradlew --version

          run_gradle_task() {
            local log_file="$1"
            shift

            echo "Running: $*"
            "$@" --console=plain --stacktrace --info 2>&1 | tee "$log_file"
            local gradle_exit=${PIPESTATUS[0]}

            if [[ "$gradle_exit" -ne 0 ]]; then
              echo "Gradle task failed. Log: $log_file"
              return "$gradle_exit"
            fi
          }

          run_gradle_task ksp-debug.log ./gradlew :app:kspDebugKotlin || exit $?
          run_gradle_task compile-debug.log ./gradlew :app:compileDebugKotlin || exit $?
          run_gradle_task build-test-lint.log ./gradlew :app:assembleDebug :app:bundleRelease testDebugUnitTest lintDebug || exit $?

      - name: Upload Gradle diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naam-jap-gradle-diagnostics
          path: |
            ksp-debug.log
            compile-debug.log
            build-test-lint.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: naam-jap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: naam-jap-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14