name: Naam Jap Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        shell: bash
        run: |
          java -version
          ./gradlew --version

          set +e
          ./gradlew :app:kspDebugKotlin --stacktrace --info 2>&1 | tee ksp-debug.log
          ksp_exit=${PIPESTATUS[0]}
          set -e

          if [[ "$ksp_exit" -ne 0 ]]; then
            if grep -Fq "Compilation error. See log for more details" ksp-debug.log \
              && ! grep -Eiq '(^|[[:space:]])e:|error:|Unresolved reference|Cannot access|Type mismatch|NonExistentClass' ksp-debug.log; then
              echo "KSP emitted only its generic compilation failure; running Kotlin compilation for additional diagnostics."
              set +e
              ./gradlew :app:compileDebugKotlin --stacktrace --info 2>&1 | tee compile-debug.log
              compile_exit=${PIPESTATUS[0]}
              set -e
            fi
            exit "$ksp_exit"
          fi

          ./gradlew assembleDebug testDebugUnitTest lintDebug --info --stacktrace
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: naam-jap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
